<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ShopKart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <a class="brand" href="/">Shop<span>Kart</span></a>
    <p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1>
    <form id="loginForm" class="form">
      <label>Email<input id="email" type="email" required placeholder="you@example.com"></label>
      <label>Password<input id="password" type="password" required placeholder="••••••••"></label>
      <button class="btn btn-primary" type="submit">Sign in</button>
      <p id="formMessage" class="message"></p>
    </form>
    <p class="switch">New to ShopKart? <a href="/register.html">Create an account</a></p>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
