<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — ShopKart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <a class="brand" href="/">Shop<span>Kart</span></a>
    <p class="eyebrow">JOIN SHOPKART</p><h1>Create account</h1>
    <form id="registerForm" class="form">
      <label>Full name<input id="name" required placeholder="Alex Morgan"></label>
      <label>Email<input id="email" type="email" required placeholder="you@example.com"></label>
      <label>Password<input id="password" type="password" minlength="6" required placeholder="At least 6 characters"></label>
      <button class="btn btn-primary" type="submit">Create account</button>
      <p id="formMessage" class="message"></p>
    </form>
    <p class="switch">Already registered? <a href="/login.html">Sign in</a></p>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
